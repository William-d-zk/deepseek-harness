# Audit policy for advisories no floor can clear: the latest published release of each
# package is itself affected, so pinning one only resolves to a version that does not
# exist. Ignored explicitly rather than lowering the audited severity, and re-checked when
# the upstream ships a fix.
#   extract-zip 2.0.1 (2 advisories, declared by apps/desktop and the repo root)
#   sprintf-js 1.1.3 (reached through roarr → global-agent → @electron/get)
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    - GHSA-hp3w-g68c-fv3c

packages:
  - vendor/*
  - packages/*/*

  - ../../.dsh-chess/profiles/web
  - ../../.dsh-chess/profiles/rchess

  - ../dsh-chess
  - ../dsh-chess/packages/*
  # The Landlock launcher is developed with its harness consumers but keeps
  # its native build and publication scripts under native/system.
  - native/system
  - native/system/packages/*
  # Product assemblies over the package tier; apps/cli owns the `dsh` bin.
  - apps/*
  # Private package owning repository-level benchmark dependencies.
  - benchmarks
  - website
  # Deploy root of the single-exe build: a pure dependency manifest whose
  # closure is what the exe bundles and what the Python runtime distributes.
  - python/sdk-runtime

overrides:
  'extract-zip>yauzl': '3.4.0'
  '@deepseek-ai/cosmokit': 'link:vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:vendor/schemastery'
  # Alioth branch stack alignment: pin the client toolchain to the
  # AliothStudio catalog versions while package specifiers stay upstream-shaped.
  # TypeScript stays at the upstream 6.x line: the Go-native 7.x drops the
  # compiler JS API that packages/typert and scripts/ consume directly.
  # React is pinned exactly, not by range: the harness resolves these packages
  # into the same page as the AliothStudio app (dsh-alioth links this
  # checkout's packages), so a caret lets the harness drift a minor ahead of the
  # app's own resolution and load a second React instance.
  react: '19.2.8'
  react-dom: '19.2.8'
  '@types/react': '^19.2.17'
  # The 6.x line is pinned project-wide (see the comment above); the
  # peerDependencyRules entry alone does not constrain non-peer dependents
  # (eslint-plugin-sonarjs declares typescript >=5 and pnpm resolved 7.x,
  # whose ESM-only build breaks sonarjs' CJS interop at load time).
  typescript: '>=5 <7'
  # Security floors (2026-10-08): `pnpm audit --audit-level=low` reported 106 findings
  # across 29 packages — every one of them a transitive dependency, none declared by a
  # workspace manifest. Each floor stays inside its package's own major line and names the
  # lowest release that clears its advisories, mirroring how the `dsh-alioth` workspace
  # floors the same families when it links this checkout.
  'brace-expansion@^1': '^1.1.21'
  'brace-expansion@^2': '^2.1.7'
  'brace-expansion@^5': '^5.0.12'
  'fast-uri@^3': '^3.1.8'
  'js-yaml@^4': '^4.3.2'
  'ip-address@^10': '^10.7.1'
  'undici@^6': '^6.28.1'
  'undici@^7': '^7.29.1'
  'undici@^8': '^8.10.2'
  'qs@^6': '^6.16.0'
  'hono@^4': '^4.13.7'
  '@hono/node-server@^1': '^1.19.15'
  'nanoid@^3': '^3.3.18'
  'postcss@^8': '^8.5.23'
  'browserslist@^4': '^4.28.7'
  'baseline-browser-mapping@^2': '^2.11.0'
  'mermaid@^11': '^11.16.1'
  'protobufjs@^7': '^7.6.5'
  'smol-toml@^1': '^1.9.0'
  'source-map-js@^1': '^1.2.2'
  'http-cache-semantics@^4': '^4.3.0'
  '@modelcontextprotocol/sdk@^1': '^1.31.0'
  '@modelcontextprotocol/client@^2': '^2.2.0'
  'dompurify@^3': '^3.4.16'
  'fflate@^0.8': '^0.8.3'
  sharp: '>=0.35.5'
  # These leave their dependent's declared range, so each was verified against the consuming
  # surface before the floor went in (same reasoning the consumer workspace records): katex
  # 0.18 renames its internal classes in markup AND in its own shipped CSS in lockstep
  # (`base`→`katex-base`), verified by rendering math in a browser; uuid's only dependent
  # imports `v4`, which every line still exports; VitePress (the sole consumer of the vite 5
  # / esbuild 0.21 pair, through the `website/` docs build) is exercised by
  # `pnpm run website:build`, and the vue floor moves `@vue/server-renderer` with it.
  katex: '^0.19.0'
  uuid: '^14.0.2'
  'vite@^5': '^6.4.3'
  vue: '^3.5.42'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

# pnpm 10+ blocks any dependency shipping an install/build script until it is
# explicitly reviewed here (strictDepBuilds defaults to true: an unlisted script
# is a hard install error). Every such package MUST be listed; we deny by
# default and only allow scripts we need. esbuild (native binary) and lefthook
# (git hooks) genuinely need theirs.
allowBuilds:
  esbuild: true
  lefthook: true
  # Cross-platform boundary for the persistent PTY backend, including ConPTY on Windows.
  node-pty: true
  # Pulled in by @earendil-works/pi-ai (optional LLM API backend). pnpm lists
  # them only because they ship lifecycle scripts, but those are no-ops we don't
  # need, so we deny them — install still succeeds.
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
  # JSONL durability calls MoveFileExW with write-through publication on Windows.
  # Consumers pin 3.1.1: Koffi 3.3.2's source build fails under GCC 13 when
  # optional prebuilts are omitted. Upgrade all consumers together after the
  # replacement passes that build and the release packed-install check.
  koffi: true
  # The Python runtime deploy includes the reviewed workspace postinstall that
  # restores the executable bit on node-pty's macOS spawn helper.
  '@deepseek-ai/dsh-subprocess-local@file:packages/subprocess/subprocess-local': true
  # electron-builder pulls in the optional Squirrel.Windows helper, whose
  # install script only selects its bundled 7-Zip executable. Desktop ships
  # Windows through NSIS, so that mutation is not part of our build.
  electron-winstaller: false
  # Store-index rewriting only needs msgpackr's portable JavaScript codec.
  msgpackr-extract: false
  '@deepseek-ai/dsh-subprocess-local': true
  # The pinned pnpm is shipped as the desktop carrier's package manager; its
  # install script links the host's native binary over the placeholder bin and
  # regenerates the Windows shims. Blocking it leaves the slower Node-backed
  # placeholder in place, so this is a script we need.
  pnpm: true

